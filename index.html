<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Expiry Tracker System</title>

  <!-- เชื่อมต่อระบบ PWA -->
  <link rel="manifest" href="./manifest.json">
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { themeMain: 'var(--theme-main)' } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root { --theme-main: #dc2626; } 
    * { font-family:'Prompt', sans-serif; transition: background-color 0.3s, border-color 0.3s; } 
    body { overflow:hidden; overscroll-behavior-y:none; }
    .bg-main { background-color: var(--theme-main); }
    .text-main { color: var(--theme-main); }
    
    .sidebar-link { display:flex; align-items:center; gap:.75rem; padding:.7rem 1rem; border-radius:.5rem; color:rgba(255,255,255,0.7); cursor:pointer; }
    .sidebar-link:hover { background:rgba(255,255,255,0.1); color:#fff; } 
    .sidebar-link.active { background:rgba(255,255,255,0.2); color:#fff; border-left: 4px solid #fff; }
    
    .badge { display:inline-flex; align-items:center; padding:.2rem .65rem; border-radius:9999px; font-size:.72rem; font-weight:600; white-space:nowrap; }
    .input { width:100%; padding:.6rem 1rem; border:1px solid #d1d5db; border-radius:.5rem; outline:none; font-size:.875rem; background:transparent; } 
    .input:focus { border-color:var(--theme-main); box-shadow:0 0 0 2px rgba(220,38,38,0.2); }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; padding:.6rem 1rem; border-radius:.5rem; font-weight:500; cursor:pointer; font-size:.875rem; border:none; transition:0.2s;}
    .btn-primary { background-color: var(--theme-main); color:#fff; } 
    .btn-primary:hover { opacity:0.9; transform:translateY(-1px); }
    .btn-secondary { background:#e5e7eb; color:#374151; } 
    .btn-icon { padding:.4rem .55rem; border-radius:.4rem; cursor:pointer; background:transparent; border:none; transition:0.2s;}
    .btn-icon:hover { background:rgba(0,0,0,0.05); } 
    .loader { border:3px solid #e5e7eb; border-top:3px solid var(--theme-main); border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; }
    @keyframes spin { 0% { transform:rotate(0); } 100% { transform:rotate(360deg); } } 
    .checkbox-wrapper { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .checkbox-wrapper input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--theme-main); cursor: pointer; }
    
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .truncate-2-lines { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

<div id="hiddenReader" style="display:none;"></div>

<!-- หน้าต่าง Login -->
<div id="loginScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-[100]">
  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md relative">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-main text-white text-4xl mb-4 shadow-lg">
        <i class="fa-solid fa-clock-rotate-left"></i>
      </div>
      <h1 class="text-2xl font-bold" id="appNameDisp">Expiry Tracker</h1>
      <p class="text-sm text-slate-500 mt-1 mb-2">ระบบแจ้งเตือนสินค้าใกล้หมดอายุ</p>
      <p class="text-xs font-mono text-slate-300 mt-1">Version: 2.0.1</p>
      <p class="text-xs font-mono text-slate-200 mt-0.5 font-medium">Dev: Kitti Prapakarn</p>
    </div>
    
    <div class="space-y-4">
      <input id="loginUser" type="text" class="input bg-slate-50" placeholder="ชื่อผู้ใช้งาน (Username)" />
      <input id="loginPass" type="password" class="input bg-slate-50" placeholder="รหัสผ่าน" />
      <div class="flex items-center justify-start mt-2 px-1">
        <label class="checkbox-wrapper text-sm text-slate-600 font-medium">
          <input type="checkbox" id="rememberMe"> จดจำการเข้าระบบ
        </label>
      </div>
      <button id="btnLogin" onclick="doLogin()" class="btn btn-primary w-full py-3 text-base mt-2 shadow-md">เข้าสู่ระบบ</button>
      <button id="btnInstallPwa" onclick="handleInstallPwa()" class="btn btn-secondary w-full py-2.5 mt-2 bg-slate-100 text-slate-600 border border-slate-200">
        <i class="fa-solid fa-download mr-2"></i> ติดตั้งแอปลงมือถือ
      </button>
      <div id="loginError" class="text-sm font-medium text-center hidden p-3 bg-red-100 text-red-600 rounded border border-red-200"></div>
    </div>
  </div>
</div>

<!-- โครงสร้างแอปหลัก -->
<div id="app" class="hidden h-[100dvh] w-full flex">
  
  <!-- เมนูด้านข้าง (โชว์เฉพาะคอมพิวเตอร์) -->
  <aside id="sidebar" class="w-64 bg-slate-900 text-white hidden md:flex flex-col relative z-50">
    <div class="p-5 border-b border-white/10 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="https://cdn-icons-png.flaticon.com/512/2897/2897785.png" class="w-10 h-10 bg-white p-1 rounded-xl">
        <h2 class="font-bold text-sm">Expiry Alert</h2>
      </div>
    </div>
    
    <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto text-sm scrollbar-thin">
      <div class="text-[11px] text-white/50 font-bold px-3 py-2 uppercase">จัดการสินค้า</div>
      <button class="sidebar-link w-full text-left" data-page="dashboard"><i class="fa-solid fa-chart-pie w-5 text-center"></i> แดชบอร์ดหมดอายุ</button>
      <button class="sidebar-link w-full text-left" data-page="products"><i class="fa-solid fa-list-check w-5 text-center"></i> รายการสินค้าทั้งหมด</button>
      
      <div class="text-[11px] text-white/50 font-bold px-3 py-2 mt-4 uppercase admin-only">จัดการข้อมูล (Admin Only)</div>
      <button class="sidebar-link w-full text-left admin-only" data-page="categories"><i class="fa-solid fa-tags w-5 text-center"></i> หมวดหมู่ & วันเตือน</button>
      <button class="sidebar-link w-full text-left admin-only" data-page="locations"><i class="fa-solid fa-map-location-dot w-5 text-center"></i> สถานที่จัดเก็บ</button>
      <button class="sidebar-link w-full text-left admin-only" data-page="users"><i class="fa-solid fa-users w-5 text-center"></i> บัญชีพนักงาน</button>
      <button class="sidebar-link w-full text-left admin-only text-yellow-400 font-bold" data-page="activity"><i class="fa-solid fa-history w-5 text-center"></i> ประวัติการใช้งาน</button>
      <button class="sidebar-link w-full text-left admin-only" data-page="settings"><i class="fa-solid fa-gear w-5 text-center"></i> ตั้งค่าระบบ & LINE</button>
    </nav>
    
    <div class="p-4 border-t border-white/10">
      <div onclick="openMyProfile()" class="flex items-center justify-between bg-black/20 p-3 rounded-xl cursor-pointer hover:bg-black/40 transition mb-2 border border-white/5">
        <img id="sideAvatar" src="" class="w-10 h-10 rounded-full object-cover bg-white hidden border-2 border-white/20">
        <div id="sideAvatarText" class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-xl shadow-inner border-2 border-white/20">👤</div>
        <div class="flex-1 min-w-0 px-3">
          <p id="userName" class="text-sm font-semibold truncate">-</p>
          <p id="userRole" class="text-[10px] text-white/60 truncate uppercase"><span class="text-yellow-400 font-bold">⭐ ดูโปรไฟล์</span></p>
        </div>
        <i class="fa-solid fa-gear text-white/40 text-xs"></i>
      </div>
      <button onclick="logout()" class="btn w-full justify-center bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white border border-red-500/30">
        <i class="fa-solid fa-right-from-bracket mr-2"></i> ออกจากระบบ
      </button>
    </div>
  </aside>

  <!-- พื้นที่หน้าจอหลัก -->
  <main class="flex-1 flex flex-col min-w-0 h-[100dvh] overflow-y-auto bg-slate-50 relative">
    <header class="bg-white border-b px-4 md:px-6 py-4 flex items-center justify-between sticky top-0 z-20 shadow-sm">
      <h1 id="pageTitle" class="text-xl font-bold uppercase text-slate-800">หน้าแรก</h1>
      <button onclick="loadCurrentPage()" class="btn-icon bg-slate-100 active:bg-slate-200"><i class="fa-solid fa-arrows-rotate text-lg text-slate-500"></i></button>
    </header>
    <div id="content" class="p-4 md:p-6 pb-28 w-full"></div>
  </main>

  <!-- แถบเมนูด้านล่าง (มือถือ) -->
  <nav id="bottomNav" class="md:hidden fixed bottom-0 left-0 w-full bg-white border-t flex justify-around items-center z-50 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] pb-safe pt-2 px-1">
    <button onclick="navigate('dashboard')" class="nav-bottom-link flex flex-col items-center text-main w-[20%]" data-page="dashboard" style="touch-action: manipulation; -webkit-tap-highlight-color: transparent;">
      <i class="fa-solid fa-chart-pie text-xl mb-1"></i>
      <span class="text-[9px] font-medium truncate w-full text-center">หน้าแรก</span>
    </button>
    
    <button onclick="navigate('products')" class="nav-bottom-link flex flex-col items-center text-slate-400 w-[20%]" data-page="products" style="touch-action: manipulation; -webkit-tap-highlight-color: transparent;">
      <i class="fa-solid fa-list-check text-xl mb-1"></i>
      <span class="text-[9px] font-medium truncate w-full text-center">สินค้า</span>
    </button>

    <!-- ปุ่มเพิ่มสินค้า -->
    <div class="w-[20%] flex justify-center -mt-8 relative z-10">
      <button onclick="openProdForm()" class="bg-main text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg shadow-red-500/30 hover:scale-105 active:scale-95 transition-transform" style="touch-action: manipulation; -webkit-tap-highlight-color: transparent;">
        <i class="fa-solid fa-plus text-2xl"></i>
      </button>
    </div>

    <button onclick="openMyProfile()" class="nav-bottom-link flex flex-col items-center text-slate-400 w-[20%]" style="touch-action: manipulation; -webkit-tap-highlight-color: transparent;">
      <i class="fa-solid fa-circle-user text-xl mb-1"></i>
      <span class="text-[9px] font-medium truncate w-full text-center">ฉัน</span>
    </button>

    <button onclick="logout()" class="nav-bottom-link flex flex-col items-center text-red-500 hover:text-red-600 w-[20%]" style="touch-action: manipulation; -webkit-tap-highlight-color: transparent;">
      <i class="fa-solid fa-right-from-bracket text-xl mb-1"></i>
      <span class="text-[9px] font-medium truncate w-full text-center">ลงชื่อออก</span>
    </button>
  </nav>
</div>

<!-- Modal &
